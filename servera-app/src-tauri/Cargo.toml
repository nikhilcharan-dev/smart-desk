[package]
name = "servera"
version = "2.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2.11.6", features = ["unstable"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ssh2 = "0.9"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
base64 = "0.22"
keyring = "2"
sysinfo = "0.38.4"
zip = "0.6.6"
walkdir = "2.5.0"
tauri-plugin-dialog = "2"
aws-config = "1"
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
aws-sdk-bedrockruntime = "1"
aws-types = "1"
glob = "0.3.3"
home = "0.5.12"
uuid = { version = "1.26.1", features = ["v4"] }
onetun = { version = "=0.3.10", default-features = false }
ipnet = "2"
aes-gcm = "0.10"
rand = "0.8"
socket2 = "0.5"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
